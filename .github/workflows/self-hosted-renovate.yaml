# Self-hosted Renovate (Mend-hosted への切り戻しを検証中のため定期実行は停止)
#
# pnpm v11 の pnpm install --lockfile-only が 2GB+ のメモリを消費し、
# Mend-hosted の microVM (3GB) では kernel OOM kill されるため用意したワークフロー。
# GitHub Actions ランナー (7GB) なら余裕で収まる。
#
# pnpm 側で修正済み:
# - https://github.com/pnpm/pnpm/issues/8441 (pnpm v11.15.1 で解消)
# - https://github.com/pnpm/pnpm/pull/13133
# - https://github.com/renovatebot/renovate/discussions/40942
#
# そのため Mend-hosted へ戻せるか検証中。schedule を外して手動実行 (workflow_dispatch) のみ残す。
# 問題なければこのワークフローごと削除する。
# 削除時は監視ルーティンも一緒に消す:
# https://claude.ai/code/routines/trig_01FcwuSkDR2RQBoy2Z9RBi9h

name: Self-hosted Renovate

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load secrets
        id: op-load-secret
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          # renovate: datasource=docker depName=1password/op versioning=semver
          version: "2.38.1"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RENOVATE_TOKEN: op://renovate/self-hosted-renovate/GITHUB_TOKEN

      - name: Run Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          token: ${{ steps.op-load-secret.outputs.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: nozomiishii/dev
